<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>页面不存在 — ClosenAI</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#050508" />
<style>
  :root {
    --accent500: #6366F1;
    --bgPrimary: #050508;
    --textPrimary: #FFFFFF;
    --textSecondary: #A1A1AA;
    --textTertiary: #71717A;
    --borderLight: rgba(255, 255, 255, 0.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bgPrimary);
    color: var(--textPrimary);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    padding: 40px 24px;
    text-align: center;
  }
  .wrap { max-width: 460px; }
  .code {
    font-size: 15px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--textTertiary); margin-bottom: 22px;
  }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.35; margin-bottom: 16px; }
  p { font-size: 16px; line-height: 1.7; color: var(--textSecondary); margin-bottom: 34px; }
  .btn {
    display: inline-block; padding: 14px 30px; border-radius: 999px;
    background: var(--accent500); color: #fff; text-decoration: none;
    font-size: 15px; font-weight: 600;
    transition: opacity .2s ease;
  }
  .btn:hover { opacity: .85; }
  .links { margin-top: 26px; font-size: 14px; color: var(--textTertiary); }
  .links a { color: var(--textSecondary); text-decoration: underline; margin: 0 8px; }
  .links a:hover { color: var(--textPrimary); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>这个页面不在</h1>
    <p>可能是链接过期了，或者地址打错了。<br />你要找的那件事，还在首页等着。</p>
    <a class="btn" href="/">回到首页</a>
    <div class="links">
      <a href="/privacy">隐私政策</a>·<a href="/terms">用户协议</a>
    </div>
  </div>
</body>
</html>
