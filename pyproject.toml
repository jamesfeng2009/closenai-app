[project]
name = "closenai-backend"
version = "0.1.0"
description = "ClosenAI — Personal Growth Tracker Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "httpx[http2]>=0.27.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "resend>=2.0.0",
    "google-genai>=1.0.0",
    "openai>=1.50.0",
    "sse-starlette>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "greenlet>=3.0.0",
    "posthog>=3.0.0",
    # R3（2026-10-16）：gRPC server 落地后这两个是**运行时**依赖，与
    # backend/requirements.txt 的主依赖列同口径（那份是镜像的装包清单，两边不许漂）。
    "grpcio>=1.84.0",
    "protobuf>=7.35.1",
    # R5（2026-10-16）：`backend/ai/mq/` 的消费者是**运行时**依赖，与
    # backend/requirements.txt 的主依赖列同口径（那份是镜像的装包清单，两边不许漂）。
    # 写上界而不是 `~=`：`~=10.1.1` 会把 10.2.x 一起挡掉，而 10.x 才是我们要跟的主线；
    # 但大版本一换，`publish()` 的 confirm 语义就可能变（它是 D-R5 那条"未确认不许 ACK"的地基）。
    "aio-pika>=10.1.1,<11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pypdf>=4.0.0",
    # R1 跨语言契约面：**只剩 grpcio-tools 留在 dev**。它带 protoc（本机 libprotoc 35.1）与
    # python 插件，是**构建期**工具，运行时镜像（deploy/Dockerfile.py-api:12 装
    # backend/requirements.txt）不该为它多装 22M。
    # grpcio 与 protobuf 已在上面的主依赖列（R3 的 `backend/ai/rpc/server.py` 真的 import 它们，
    # 2026-10-16 挪的；两边口径必须一致，requirements.txt 里逐字写了为什么）。
    #   · `~=1.84.0` 而不是 `>=`：protoc 版本一变，生成物字节就变，R1 的逐字节漂移闸
    #     （scripts/gen_proto.py --check）会在别人没换工具链时假红。
    "grpcio-tools~=1.84.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

# 构建系统配置（本地开发用 uv 或 pip 均可）
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
