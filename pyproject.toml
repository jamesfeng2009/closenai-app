[project]
name = "closenai-backend"
version = "0.1.0"
description = "ClosenAI — Personal Growth Tracker Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "httpx[http2]>=0.27.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "resend>=2.0.0",
    "google-genai>=1.0.0",
    "openai>=1.50.0",
    "sse-starlette>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "greenlet>=3.0.0",
    "posthog>=3.0.0",
    "pyswisseph>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

# Vercel Python runtime 配置
# 告诉 Vercel 从 backend.main 模块加载 app 变量（FastAPI 实例）
[tool.vercel]
entrypoint = "backend.main:app"

# 构建系统配置（本地开发用 uv 或 pip 均可）
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
