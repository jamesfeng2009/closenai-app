# Alembic 配置
# 数据库连接串通过环境变量 DATABASE_URL 注入（见 alembic/env.py），
# 不在本文件硬编码，避免泄露密钥。

[alembic]
script_location = %(here)s/alembic
# 项目根目录（backend 的父目录）加入 sys.path，使 `import backend` 可用
prepend_sys_path = %(here)s/..
# 从 backend.config 读取 database_url，而不是在此写死
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S