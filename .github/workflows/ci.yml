# T0-03 · CI 门禁五作业（2026-10-18）。
#
# 动机（Baseline §18/§22）：30+ 个闸此前全靠人记得本地跑；这个文件把
# 「谁改坏了什么当场红」变成机器义务。
#
# 环境名不臆造，逐条来自测试自己的取数口径：
#   · `backend/tests/_pg_env.py`：`TEST_DATABASE_URL` ＋ `CLOSEN_REQUIRE_PG=1`
#     （缺 env 从静默 skip 变成 fail——这正是本闸要的形状）；
#   · `backend/tests/test_canonical_schema.py:452`：迁移往返用独立空库 `N2_MIGRATE_DATABASE_URL`；
#   · `backend/tests/test_r5_interop_broker.py:100`：broker 面读 `CLOSEN_AMQP_URL`；
#   · go 测试 `go test -p 1`：批 4 教训——并发跑包会共用 vhost 造成假红。
# 本文件的每个 service/healthcheck 都对应一次本机 dry-run（见任务板 T0-03 结案行）。
name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同一分支的新 push 取消还没跑完的旧 run（省 runner，也让红更快）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector 官方镜像：alembic 首条迁移就 CREATE EXTENSION vector（2026-10-18 本机
        # 实测裸 postgres:16 在 migrate 处 FeatureNotSupported）。
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/closenai_ci
      N2_MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/n2_roundtrip
      CLOSEN_REQUIRE_PG: "1"
      CLOSEN_AMQP_URL: amqp://guest:guest@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.lock
            backend/requirements-dev.in
      # go 工具链不是可选项：test_proto_cross_language / test_go_auth_interop /
      # test_r5_interop_broker 都会 shell-out 到 go（GO_BIN 缺省走 PATH）。
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - name: Install deps
        run: bash scripts/install_backend_deps.sh --dev
      - name: Install schema toolchain (pg_dump + sqlc)
        # T6-03 的两条闸只有装了工具才真跑，否则按「宿主没有工具链」skip：
        #   · pg_dump —— `test_pg_schema_snapshot.py` 的第三条要把 alembic 重建成一次性库
        #     再逐字节比快照（这一条不吃 pg_dump 就退化成只看列名的离线闸）；
        #   · sqlc —— `test_canonical_schema.py::test_sqlc_generated_code_matches_queries`
        #     用 `sqlc diff` 拍「.sql 与生成物两个真源」（工单 §怎么做.5：CI 校验生成物可复现，
        #     而 sqlc generate 只在生成物变红时人手跑一次）。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Create CI databases
        run: |
          python - <<'EOF'
          import psycopg
          for dbname in ("closenai_ci", "n2_roundtrip"):
              conn = psycopg.connect(
                  "postgresql://postgres:postgres@127.0.0.1:5432/postgres", autocommit=True
              )
              exists = conn.execute(
                  "select 1 from pg_database where datname = %s", (dbname,)
              ).fetchone()
              if not exists:
                  conn.execute(f'CREATE DATABASE "{dbname}"')
          EOF
      - name: Migrate CI database
        # `CLOSEN_REQUIRE_PG=1` 让实库用例「缺库就红」，而**没迁移的库同样是缺库**：
        # 2026-10-18 补这一步之前，本作业只建库不迁移，`test_canonical_schema` 的三条
        # live 用例与 T1-01 的 `test_data_export_pg` 在 runner 上必然红。本机 dry-run 用的是
        # 已经 upgrade 过的库，正好把这个缺口盖住——所以现在按同一口径把它钉成步骤。
        # scheme 用 `postgresql+psycopg`：本仓只声明 psycopg[binary]（asyncpg 不在依赖里），
        # alembic 的 env.py 从 backend.config 读 DATABASE_URL，本机实测该串可跑到 head。
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/closenai_ci
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: 生成本次运行的一次性 JWT 口令
        # 为什么这一步存在（2026-11-04 实测红 7 条）：本作业此前不给 JWT_SECRET，
        # `backend/config.py:48` 的默认值是空串，于是凡走「注册→签发 JWT」这条路的用例
        # 在 runner 上全红在 `jwt.exceptions.InvalidKeyError: HMAC key must not be empty.`
        # （test_referral 三条、test_db_commit_boundary 两条、test_consent_purposes／
        # test_jwt_algorithm_baseline 各一条）。本机看不见这批红，因为 env 文件里总有一个口令。
        # 修法不是往 ci.yml 里写一个串——口令一律 env-only（凭据不入库），而且部署面的口径是
        # 「由环境提供」（deploy/compose 里就是 `${JWT_SECRET:?…}`）。测试要的是「有一个能签的密钥」，
        # 不是「跨运行可复现的 token」：任何断言都不许依赖这个值本身，依赖了下一跑就红。
        run: |
          python - <<'EOF'
          import os, secrets
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"JWT_SECRET={secrets.token_urlsafe(48)}\n")
          print("已生成本次运行的一次性 JWT 口令（不落盘、不入库、不跨运行）")
          EOF
      - name: pytest (backend)
        # 本机同环境实测：1166 passed／3 skipped。三条 skip 是有意的，不是漏配 env：        #   · test_go_py_service_interop 两条要宿主 docker＋go/py 两个本地镜像＋具名 PG 容器
        #     （T0-01a 本机已 2 passed 取证，runner 上自建镜像要花 6–8 分钟且不是本闸的判据）；
        #   · test_k8s_manifests 一条要真集群里的 closenai 命名空间（建 ns 属部署动作）。
        run: python -m pytest backend/tests -q

  go:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      # amqp 集成测试带真 broker 才跑（不带就 skip，等于这条门禁白配）。
      CLOSEN_AMQP_URL: amqp://guest:guest@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: |
            go-core/go.sum
            go-core/tools/protogen/go.sum
      - name: gofmt
        run: |
          cd go-core
          gofmt -l . | tee /tmp/fmt
          test ! -s /tmp/fmt
      - name: go vet
        run: cd go-core && go vet ./...
      # -p 1：并发跑包会共用 vhost 造成假红（批 4 教训，见任务板 T0-03）。
      - name: go test
        run: cd go-core && go test -p 1 ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 2026-11-04：20 → 22。`better-sqlite3@13.0.3` 在 npm 锁里自带 engines.node=">=22"，
          # 而 npm 对 engines 不符只 warn 不拦——v20 的跑机会装到一个 ABI 对不上的原生二进制，
          # 表现为 jest worker `signal=SIGSEGV`、13 个 suite 一个都没跑起来（失败数却是 0）。
          # 下限不猜：由 backend/tests/test_ci_workflow_versions.py 现读锁里逐包 engines 算出来。
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: cd frontend && npm ci
      - name: 原生模块自检（better-sqlite3 必须真能 require）
        # npm ci 绿 ≠ 原生模块可用；这一步把它变成**安装期就红**，而不是让根因
        # 藏在 13 个 suite 的段错误里。建库、写一行、读回来，三个动作都要成。
        run: |
          cd frontend
          node -e "const pkg=require('better-sqlite3/package.json');const D=require('better-sqlite3');const db=new D(':memory:');db.exec('create table t(x)');db.prepare('insert into t values (?)').run(7);if(db.prepare('select x from t').get().x!==7)throw new Error('roundtrip 不符');console.log('better-sqlite3 '+pkg.version+' 可用，node '+process.version)"
      - name: jest
        run: cd frontend && npx jest --silent
      - name: tsc
        run: cd frontend && npx tsc --noEmit

  contract:
    # 生成物不许手改：台账/protoc 产物与源码不同步就在这里红。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.lock
            backend/requirements-dev.in
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - name: Install deps
        # 开发锁 = 运行锁 + pypdf + grpcio-tools；构建期工具的版本也在锁里。
        run: bash scripts/install_backend_deps.sh --dev
      - name: OpenAPI/endpoint ledger idempotent re-export
        run: |
          python scripts/export_contract.py
          git diff --exit-code contracts/
      - name: proto re-gen idempotent
        run: |
          python scripts/gen_proto.py
          git diff --exit-code go-core/gen backend/gen contracts/proto
      - name: cutover matrix re-gen idempotent
        # T6-02：contracts/cutover-matrix.md 是三张真源（Ingress 归属 × endpoints 登记表 ×
        # Go 路由声明表）的对账产物。`go test ./internal/cutover/` 已经会因过期而红，
        # 这一步的价值是把**该跑哪条命令**写在 CI 日志里，而不是让人猜生成器在哪。
        run: |
          (cd go-core && go run ./tools/cutovermatrix -write)
          git diff --exit-code contracts/cutover-matrix.md

  taskboard:
    # 总表↔详情同源；DONE 必须带结案行（scripts/task_board.py 的判据）；
    # 功能状态台账（T0-05）由四个证据面对账，生成物过期或状态虚高都在这里红。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: task_board --check
        run: python scripts/task_board.py --check
      - name: feature status ledger re-render
        # 判据违例（虚高 state／指不到的证据）由脚本自己拒写；git diff 再拦一道「改了 JSON 没重跑」。
        run: |
          python scripts/feature_status.py
          git diff --exit-code docs/feature-status.md

  # T0-06 变异自证抽样：只跑与本次改动相关的 `scripts/mutate_*.py`（上限 3 条，全量交给
  # `mutation-nightly.yml`）。判据不是「脚本退 0」这一条——先跑被选脚本点名的闸要求全绿
  # （正向证人），再跑变异要求打红到位，最后用 git 独立复核工作区与跑前逐字一致
  # （脚本自己声称 copy2＋filecmp 恢复了，这里不信自述）。
  # 反向演示（任务板 T0-06 结案行）：把某条闸的断言掏空 ⇒ 变异不再打红 ⇒ 本作业红。
  mutation-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        # pgvector：alembic 首条迁移就 CREATE EXTENSION vector（同 backend 作业的理由）。
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/closenai_mut
      CLOSEN_REQUIRE_PG: "1"
      CLOSEN_AMQP_URL: amqp://guest:guest@127.0.0.1:5672/
      # 往返梯（`test_canonical_schema.py` 的 PG 专属用例）要的是一个**没迁移过**的空库，
      # 与 backend 作业同一口径；缺这个 env 时整条梯 skip，而变异脚本把它记「未跑」＝非零退出。
      N2_MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/n2_roundtrip
    steps:
      - uses: actions/checkout@v4
        # 深克隆不是优化项，是这个作业能不能抽样的前提（2026-11-04 实测，run 41772007098）：
        # 默认 fetch-depth=1 时仓库里只有 HEAD 一个提交，下面的 `HEAD~1` 无从解析，
        # 于是这一步红在 `git diff --name-only HEAD~1 失败：fatal: ambiguous argument 'HEAD~1'`。
        # 其余作业只跑当前 checkout 出来的代码，不比对历史，所以深度只补在这里。
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.lock
            backend/requirements-dev.in
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - uses: actions/setup-node@v4
        with:
          # 同 frontend 作业那句：20 会装出 ABI 不匹配的 better-sqlite3，
          # 而变异脚本里那些要跑 jest 的闸正好会 require 它（红在段错误上，看不出根因）。
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        # 变异脚本三边都可能动：pytest 闸、jest 闸、go 测试——装齐了才有资格说「抽样跑过」。
        # T6-03 那条还要 pg_dump 与 sqlc：少一样它只能记「未跑」，抽样就成了假抽样。
        run: |
          bash scripts/install_backend_deps.sh --dev
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          cd frontend && npm ci
          node -e "const pkg=require('better-sqlite3/package.json');const D=require('better-sqlite3');const db=new D(':memory:');db.exec('create table t(x)');db.prepare('insert into t values (?)').run(7);if(db.prepare('select x from t').get().x!==7)throw new Error('roundtrip 不符');console.log('better-sqlite3 '+pkg.version+' 可用，node '+process.version)"
      - name: Create and migrate mutation database
        # 缺库时实库闸会 skip，而 skip 不算绿；CLOSEN_REQUIRE_PG=1 让它变成 fail，
        # 所以这里必须把库建好并升到 head，而不是让抽样在空集上假绿。
        # 2026-11-04：这一步原来没挂 DATABASE_URL，alembic 于是按 backend/config.py:37 的默认串
        # （sqlite+aiosqlite:///./closenai.db）跑——2026-11-03 它红在 `No module named 'aiosqlite'`。
        # 「装上 aiosqlite 之后它会绿着把迁移打到 sqlite 文件」是我先前的推断，本机实测**不成立**：
        # 这条链在 sqlite 上红在 `CREATE EXTENSION IF NOT EXISTS vector`（pgvector 那条迁移）。
        # 所以这里的 env 不是防假绿，而是让迁移真的落到 closenai_mut 这个 PG；证人再补一层落到了的证据。
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/closenai_mut
        run: |
          python - <<'EOF'
          import psycopg
          for dbname in ("closenai_mut", "n2_roundtrip"):
              conn = psycopg.connect(
                  "postgresql://postgres:postgres@127.0.0.1:5432/postgres", autocommit=True
              )
              if not conn.execute(
                  "select 1 from pg_database where datname = %s", (dbname,)
              ).fetchone():
                  conn.execute(f'CREATE DATABASE "{dbname}"')
          EOF
          alembic -c backend/alembic.ini upgrade head
          # 正向证人：只验 upgrade 的退出码不够——本机实测对着一个从未 stamp 过的库，
          # `alembic current` 不打印任何版本行**但仍退 0**（2026-11-04 拿临时 sqlite 库跑的），
          # 退出码因此不构成「库里真有 schema」的证据。又因为 backend/alembic.ini 的
          # handler_console 走 sys.stderr，这里要 2>&1，否则抓的是个空流、grep 恒红。
          alembic -c backend/alembic.ini current 2>&1 | tee /tmp/alembic_current.txt
          grep -q "(head)" /tmp/alembic_current.txt
      - name: Resolve diff base
        id: base
        # 深克隆补上之后，这一步还得**红得起来**。2026-11-04 实测（run 41772007098）：
        # `echo "sha=$(git rev-parse HEAD~1)"` 在浅克隆里把字面量 "HEAD~1" 写进了输出而且这一步退 0
        # ——git rev-parse 解析不出来的参数会原样打到 stdout 再退 128，而命令替换写在 echo 的参数位置
        # 时它的退出码被 echo 盖掉（GH 默认 shell 是 `bash -e`，本机复现过：步骤 rc=0）。
        # 于是红落在了下一步 `git diff --name-only HEAD~1` 上，看起来像抽样脚本坏了。
        # 改成 `sha="$(git rev-parse --verify …)"`：--verify 解析不出来就不输出，
        # 而赋值形式的退出码就是这一步的（本机复现：步骤 rc=128）。
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.base.sha }}"
          else
            sha="$(git rev-parse --verify 'HEAD~1^{commit}')"
          fi
          # 正向证人：这一步绿的前提是「base 在本仓库里真是一个提交，且它后面有东西可比」。
          # 缺这一层会退回空集假绿：base 写错或写空 → --changed-from 拿到垃圾 →
          # mutation_sample.py 走「没有可比对的变更：抽样集为空」那条分支退 0，整个作业绿着什么也没抽。
          git cat-file -e "${sha}^{commit}"
          echo "diff base = ${sha}，其后 $(git rev-list --count "${sha}..HEAD") 个提交可比对"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - name: 造 .venv 入口（变异脚本硬编码 REPO/.venv/bin/python）
        # 为什么这一步存在（2026-11-04 实测，run 41789159667）：本作业抽到
        # `scripts/mutate_ci_workflow_gates.py` 时整条红在
        # `FileNotFoundError: /home/runner/work/closenai-app/closenai-app/.venv/bin/python`。
        # 根因不在那条脚本：磁盘上 75 条 `scripts/mutate_*.py` 里 71 条把解释器钉成
        # `REPO/.venv/bin/python`，而跑机的依赖是 `scripts/install_backend_deps.sh --dev` 装进
        # setup-python 那个解释器的——跑机上根本没有 `.venv` 这个目录。
        # 也就是「抽样作业永远抽不到任何钉着 .venv 的脚本」，而不是那些脚本坏了。
        #
        # 为什么是指针而不是新建虚拟环境：`python -m venv .venv` 造出来的空环境看不见上面
        # 刚装好的 pytest／sqlalchemy／psycopg，要么再装一遍锁（多花几分钟且与证人不同源），
        # 要么 `--system-site-packages` 赌它的可见性语义。这里直接把**跑机那个解释器**暴露成
        # 脚本认识的入口，同一个解释器、同一份 site-packages，零安装。
        # 下面三条 exec 是这一步的正向证人：`.venv/bin/python` 能起 pytest、能 import 本仓的
        # 链头推导模块、`.venv/bin/pytest` 这个控制台脚本本身也能跑
        # （`mutate_deviation_gates.py` 直接 exec 的是它，不是 `-m pytest`）。
        run: |
          python - <<'EOF'
          import os, pathlib, shutil, sys
          bin_dir = pathlib.Path(".venv/bin")
          bin_dir.mkdir(parents=True, exist_ok=True)
          exe = pathlib.Path(sys.executable).resolve()
          for name in ("python", "python3"):
              link = bin_dir / name
              if not link.is_symlink() and not link.exists():
                  os.symlink(exe, link)
          for script in ("pytest", "alembic"):
              found = shutil.which(script)
              if found:
                  link = bin_dir / script
                  if not link.is_symlink() and not link.exists():
                      os.symlink(pathlib.Path(found).resolve(), link)
          print(f".venv/bin/python -> {exe}")
          EOF
          .venv/bin/python -m pytest --version
          .venv/bin/python -c "from backend.core.alembic_chain import head_revision; print('venv 证人：链头', head_revision())"
          .venv/bin/pytest --version
      - name: 生成本次运行的一次性 JWT 口令
        # 同 backend 作业那一步的理由：抽到的变异脚本会**整文件跑**依赖 JWT 的闸
        # （如 `mutate_deviation_gates.py`／`mutate_w5_gates.py`／`mutate_batch3_gates.py` 的靶），
        # 缺口令时它们先红在 `InvalidKeyError`，`mutation_sample.py` 于是判
        # 「正向证人先红了：此时变异打红不算证据」——抽样面整体失去证据力。
        # 口令 env-only、每次运行现生成、不落盘不入库；测试要的是「有一个能签的密钥」，
        # 不是某一个固定值。
        run: |
          python - <<'EOF'
          import os, secrets
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"JWT_SECRET={secrets.token_urlsafe(48)}\n")
          print("已生成本次运行的一次性 JWT 口令（不落盘、不入库、不跨运行）")
          EOF
      - name: mutation_sample（按改动抽样，串行）
        run: python scripts/mutation_sample.py --changed-from "${{ steps.base.outputs.sha }}" --limit 3
