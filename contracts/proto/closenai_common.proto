// ClosenAI 跨语言公共形状（R1 · 单一契约源之一）。
//
// 字段面的出处不是 V3 的逻辑清单，而是**本仓今天真的在用的形状**：
//   - SourcePointer       = go-core/internal/domain/service_evidence.go:30-32
//                           （D-2「source_records 只做指针，不复制内容」，
//                            列面 backend/models/canonical.py:121-125 的 source_table/source_id/occurred_at）
//   - Safety / SafetyStatus = go-core/internal/domain/candidate.go:33-36 与 :24-28
//   - Envelope            = V3 15_PROTOBUF_WIRE_CONTRACT.md:41-53（十一字段逐字，含 schema_version 为 string）
// 号位纪律（V3 15 §6/§7/§8/§9/§10 ＋ 10 §10）：字段号**永不复用**（15:91、10:157）；
// 删除只许 `reserved`（15:93-98）；只许 additive 且同号不许换类型（15:100-124）；
// 跨语言时间一律 google.protobuf.Timestamp（15:132-138）；id 一律显式 string（15:140-145）；
// 每条契约消息都带 schema_version（10 §10 `:151-155` 逐字「Every contract message has: schema_version」）。
//
// ───────────────────────── 两个信封的分工（先说破，免得下游以为只有一条）
//   · 本文件的 `Envelope` ＝ **命令面与回投面**的载体（closenai_ai.proto 的 TaskRequested /
//     Candidate / EvidenceCandidate / ProactiveDraft 序列化后放它的 payload 字段）。
//     形状照 V3 15 §3 逐字——那是 V3 全 22 篇编号文档里**唯一**成文的 protobuf 定义。
//   · closenai_events.proto 的 `EventEnvelope` ＝ **事件面**的信封，形状照本仓 outbox
//     的真实列面（go-core/db/schema/0003_outbox_messages.sql:36-55 ＋
//     go-core/internal/domain/delivery.go:58-70 的 OutboxRow），11 §2 的愿望清单里
//     本仓没有的列它也不假装有了。
//   为什么不合一条：合并＝同时改两个契约源，收益只是少一个消息，代价是把 R4 的 outbox
//   映射重写一遍，而且 15 §3 那份会因此偏离它逐字抄的 V3 原文。
//   ⚠️ 两个信封今天都**还没有代码引用**：R1 只定形状，R4/R5 才落地。
//
// ───────────────────────── 本批撤下的两个形状（删由，不是遗漏）
// 首稿在这里定义过 `MemoryRef{memory_id,excerpt,created_at}` 与
// `EvidenceRef{evidence_id,role,source_table,source_id,observed_at,strength}`，本批删掉：
//   · `MemoryRef` 的三键确实是**前端逐字读取的响应契约**
//     （contracts/frontend-compat.md:99 那一行：`memory_refs[].{memory_id,excerpt,created_at}`，
//      消费点 `ReflectScreen.tsx:495-501`；另有 :83 登记整条端点面；由
//      `backend/routers/chat.py:174-182` 构造，三键在 :176-178）。
//     但它是 **HTTP/JSON 响应面**，不是跨语言提案面：证据回链在 Go 侧是**读路径现构**的
//     （go-core/internal/domain/evidence_read.go:236 逐字「source_id 为空 ⇒ 不给 memory_ref」），
//     而提案消息（Candidate / EvidenceCandidate / ProactiveDraft）里没有一列装得下它——
//     canonical `proactives` 的 INSERT 列面逐字没有 memory_refs
//     （go-core/db/queries/canonical.sql:340-345）。留着它＝提案方可以伪造
//     「这条产物来自用户哪句原话」，而那句话是要给用户看的回链。
//   · `EvidenceRef` 是 `domain.Evidence`（candidate.go:87-99）的形状，但那条是 **Gate 的内部投影**
//     （注释逐字「Evidence 是 Gate 需要的证据投影」），不是提案面；提案面是 EvidenceCandidate。
//     跨进程消息里没有任何一条需要嵌套「我引用了这些证据」，因为 Candidate 用 evidence_ids。
// 加回条件（写死在这里）：R5/R6 先把 journey_events 的权威写权定下来
// （ownership.md §2 末已登记那条双写欠账），若届时提案方确实要带引用，
// **加新号位**并同步补契约登记表，不许复用上面的号位。
//
// 闸的判据（scripts/ 里的 R1 闸）：任何字段号复用 / 非 additive 类型变更 /
// 消息缺 schema_version ⇒ 直接红。
syntax = "proto3";

package closenai.v1;

import "google/protobuf/timestamp.proto";

// go_package 必须等于 go-core/go.mod:1 的 module 路径加子目录，否则生成的包 import 不进来。
option go_package = "github.com/jamesfeng2009/closenai-app/go-core/gen/closenai/v1;closenaiv1";
// 刻意不加 java_* option：V3 15 §2（`:16-34`）只列 Go 与 Python 两个生成面，本仓没有 JVM 消费方。

// SourcePointer 指向一条既有业务行。D-2 的口径：source_records 只做指针，不复制内容，
// 所以这里**没有**正文字段——正文由 Go 按 (source_table, source_id) 回库里取。
// 三列逐字对 backend/models/canonical.py:121-125（source_table / source_id / occurred_at 可空）。
message SourcePointer {
  string source_table = 1;
  string source_id = 2;
  // 观测发生时刻（UTC）。occurred_at 在库里**可空**（canonical.py:123-125），
  // 所以这里也是 optional：空＝来源行没记观测时刻，映射层不许拿 created_at 顶替。
  optional google.protobuf.Timestamp occurred_at = 3;
}

// Safety 是 Gate 第 6 关的输入（candidate.go:33-36）。
// D-8：跨进程后 **UNSPECIFIED 不得当放行**——映射层必须把它落成 Go 侧的
// Safety==nil 或 SafetyStatusUnavailable，走 fail-closed（candidate.go:65 逐字
// 「nil 视为判定缺失 → fail-closed」）。
message Safety {
  SafetyStatus status = 1;
  // self_harm / relationship_violence / medical（candidate.go:77 的敏感域三值 switch）。
  // 前两类的词表在 backend 侧（backend/services/safety_service.py:180-196 的 CRISIS_TRIGGERS，
  // 判定顺序 self_harm → relationship_violence 见 :296 与 :304）；
  // `medical` 是 V3 03 §14 Safety 段点名的 medical-emergency 信号（candidate.go:30-32 的注释）。
  // 留 string 而不是 enum：这三值是 backend 既有口径的自由字符串，Go 用 switch 判定，
  // 新增类别不该变成契约变更。
  repeated string categories = 2;
}

enum SafetyStatus {
  SAFETY_STATUS_UNSPECIFIED = 0;
  SAFETY_STATUS_OK = 1;
  SAFETY_STATUS_CRISIS = 2;
  // 跨进程新增：Python 侧判定超时/不可用时**显式**报这个值，
  // 而不是省略字段——省略＝UNSPECIFIED，两者在 Go 侧都必须 fail-closed。
  // 这正是 D-8 要把今天的 fail-open（safety_service.py:360 的 docstring ＋ :393-395 的实现）
  // 反过来那条的落点。
  SAFETY_STATUS_UNAVAILABLE = 3;
}

// Envelope 逐字抄 V3 15:41-53（十一字段、字段号 1-11 顺序一致）。
// ⚠️ 首稿在这里加过第十二条 `optional string origin`，本批删掉：它指不出本仓的任何既有事实
// （既不是 outbox 列，也不是 domain 结构字段），属于「先造出来再找理由」的那类字段。
// 命令面要的「为哪个用户跑」由 `user_id`（8）承载——V3 15:49 本来就有这一条，
// 不需要再造一个语义重叠的 origin。号位 12 就此 reserved，永不复用（15 §6）。
message Envelope {
  string message_id = 1;
  string message_type = 2;
  // string，不是 int：V3 15:44 逐字是 `string schema_version = 3;`。
  // 本仓取值＝十进制整数字符串（与 outbox 的 `schema_version integer DEFAULT 1`
  // 对齐，go-core/db/schema/0003_outbox_messages.sql:40 ＋ CHECK :54），
  // 但类型不许改成 int32——那是 15 §7 明令禁止的「同号换类型」。
  string schema_version = 3;
  google.protobuf.Timestamp occurred_at = 4;
  // go-api / python-worker（V3 11 §6 producer identity）。
  string producer = 5;
  string correlation_id = 6;
  string causation_id = 7;
  string user_id = 8;
  string personal_model_id = 9;
  uint32 attempt = 10;
  // 序列化的**业务消息**字节。两处逐字：14 §6 `:90-95`
  // 「The AMQP body is the serialized protobuf bytes」＋「body = proto.Marshal(message）」，
  // 以及 16:91 的 `body = message.SerializeToString()`。
  bytes payload = 11;
  reserved 12;
  reserved "origin";
}
