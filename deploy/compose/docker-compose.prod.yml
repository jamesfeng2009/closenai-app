# T0-01b（代码面先行）· 生产编排模板（VPS 单机）。验收整条仍绑 T0-01/VPS 上线，本文件未上线。
#
# 与 dev 同一批镜像，只换 env、资源限制与 restart 策略（任务板 T0-01b.1）。
# 密钥一律 ${VAR:?}——`docker compose config` 里出现任何明文口令就是这条编排出错。
# DB 形态按 B-01 默认：托管 Supabase（DATABASE_URL 注入）；若要同机自建 PG，
# 参照 docker-compose.dev.yml 的 postgres 服务加回本文件并按容量核算 +2G。
# 调度：宿主 crontab（deploy/schedule/crontab）打 127.0.0.1:8000 ⇒ py-api 必须发布
# 127.0.0.1:8000（仅回环）；go-api/ai-rpc/rabbitmq 不对公网（8080/5672 不发布是验收项）。

name: closenai-prod

x-py-image: &py-image
  image: ${PY_IMAGE:?镜像 tag 由发布流程注入，见 deploy/README.md}

services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3-management}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: {max-size: "50m", max-file: "3"}

  py-api:
    <<: *py-image
    environment:
      DATABASE_URL: ${DATABASE_URL:?Supabase 连接串（生产走 TLS）}
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?}
      CRON_SECRET: ${CRON_SECRET:?}
      CLOSEN_AMQP_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/
      QSTASH_TOKEN: ${QSTASH_TOKEN:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      # T1-01 数据导出归档目录（宿主 crontab 每 5 分钟认领队列并生成到这里）。
      EXPORT_DIR: ${EXPORT_DIR:-/data/exports}
    volumes:
      - exports:/data/exports
    ports:
      - "127.0.0.1:8000:8000" # 宿主 crontab + Caddy 上游，都不出回环
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging

  ai-rpc:
    <<: *py-image
    command: ["python", "-m", "backend.ai.rpc.server"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      JWT_SECRET: ${JWT_SECRET:?}
      ENVIRONMENT: production # 与 py-api 同档：漏了会退回 development 的设备身份透传口径
      CLOSEN_AMQP_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  py-ai-worker:
    <<: *py-image
    command: ["python", "-m", "backend.ai.mq.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      JWT_SECRET: ${JWT_SECRET:?}
      ENVIRONMENT: production
      CLOSEN_MQ_WORKER: ${CLOSEN_MQ_WORKER:-0} # 灰度键默认关：编排就位≠流量放行（R5 口径）
      CLOSEN_AMQP_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    mem_limit: 700m
    restart: unless-stopped
    logging: *logging

  go-api:
    image: ${GO_IMAGE_TAG:?}
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?}
      HTTP_ADDR: ":8000"
      CLOSEN_PY_API_URL: http://py-api:8000
      CLOSEN_AMQP_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/
      CLOSEN_OUTBOX_WORKER: ${CLOSEN_OUTBOX_WORKER:-0} # 同上：开关面不在编排里偷偷放量
      CLOSEN_CANDIDATE_WORKER: ${CLOSEN_CANDIDATE_WORKER:-0}
    # 不发布宿主端口：只在网络内 go-api:8000 可达（方案 §12：go-api 不对公网）。
    depends_on:
      rabbitmq:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      py-api:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

volumes:
  rabbitmqdata:
  caddydata:
  # T1-01：导出归档只挂 py-api（下载端点在它身上，别的进程没有读它的理由）。
  # 归档默认保留 7 天（settings.export_retention_days），到期由 /cron/export-jobs 删文件。
  exports:
