# 非敏感运行时配置。变量名是跨语言契约：go-core/internal/config/config.go 与
# backend/config.py 读同一批名字，任一侧改名都会破坏互认（见 test_go_auth_interop.py）。
# 敏感项（DATABASE_URL / JWT_SECRET / CRON_SECRET / provider keys）一律走 Secret
# closenai-runtime，清单里不出现值——创建命令见本目录 README 段末尾的注释。
apiVersion: v1
kind: ConfigMap
metadata:
  name: closenai-config
  namespace: closenai
data:
  APP_NAME: "ClosenAI"
  ENVIRONMENT: "production"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_EXPIRE_MINUTES: "30"
  JWT_REFRESH_EXPIRE_DAYS: "30"
  HTTP_ADDR: ":8000"
  SHUTDOWN_TIMEOUT_SECONDS: "15"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # ── N8 灰度面（Go-only，变量名带 CLOSEN_ 前缀，Python 侧没有对应字段）──
  # 集群内 py-api 的 Service 地址。百分比未到 100 的域，go-api 把请求逐字转交到这里；
  # 缺这个值而百分比 <100 时 go-api **拒绝启动**，所以它不能留空或靠默认值。
  CLOSEN_PY_API_URL: "http://py-api.closenai.svc.cluster.local:8000"
  # 每域一个数：0＝该域一条都不自己答（真的 0%，只多一跳代理），100＝全量由 Go 答。
  # 越界（<0 或 >100）是拒绝启动而不是夹紧——「运维以为切了其实没切」比没有开关更糟。
  CLOSEN_CUTOVER_ANALYTICS: "0"
  CLOSEN_CUTOVER_DISCOVERY: "0"
  # 批 2（curriculum 域）：这一域的响应里有 week_start / 每张卡的 date / revealed，
  # 全是「用户本地今天」的函数，所以它是第一个带**日历**的域。0% 时 go-api 逐字转交，
  # 放量前唯一的判据是 go-core/testdata/n8_contract.json 的 curriculum 组与 week_window 语料。
  CLOSEN_CUTOVER_CURRICULUM: "0"
  # 批 3（journey 域）：这一域的 GET /journey/events 是**惰性写入者**——先按剧本预写
  # （ensure_prefilled，六行一个事务）再读。0% 时 go-api 逐字转交、一行业务都不跑，
  # 所以写权仍在 Python 一侧；一旦放量，同一账号的预写就由 Go 提交，判据是夹具的
  # journey 组 46 条逐字节回放（含 uuid 主键的掩码次数，见 n8_replay_test.go）。
  CLOSEN_CUTOVER_JOURNEY: "0"
  # 批 4（onboarding 域）：这一域的 POST 是**一次请求写三处**——推荐码惰性生成、
  # onboarding_profiles upsert（无条件）、六行剧本预写，Python 用请求级事务在响应前一次提交，
  # Go 侧对应 SubmitOnboarding 的单个 pgx 事务。另两处只有本批有的判据：响应里的文案要过
  # 措辞闸（filter_template，零 LLM），share_url 的深链形状由 site_url＋推荐码字符集决定。
  # 0% 时 go-api 逐字转交，三处写与闸都仍归 Python；放量判据＝夹具 onboarding 组 28 条
  # 逐字节回放＋template_corpus 106 条（闭包 92＋对抗探针 14）。
  CLOSEN_CUTOVER_ONBOARDING: "0"
  # PostHog 收件箱地址。默认值两侧都是这个字面量（backend/config.py:160），
  # 写进清单是为了让「换区域」是一次配置改动而不是重新出镜像。
  # POSTHOG_API_KEY 属敏感项，只进 Secret closenai-runtime，不进本文件。
  POSTHOG_HOST: "https://eu.i.posthog.com"
