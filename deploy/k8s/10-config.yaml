# 非敏感运行时配置。变量名是跨语言契约：go-core/internal/config/config.go 与
# backend/config.py 读同一批名字，任一侧改名都会破坏互认（见 test_go_auth_interop.py）。
# 敏感项（DATABASE_URL / JWT_SECRET / CRON_SECRET / GO_SERVICE_TOKEN / provider keys）一律走
# Secret closenai-runtime，清单里不出现值——键面与创建命令见 `deploy/README.md`
# 「k8s 侧 Secret closenai-runtime 的键面」（2026-10-19 更正：本目录没有 README，
# 原来那句「见本目录 README」是一条悬空引用）。
#
# ── 日志口径（批 T-F，2026-10-17）──────────────────────────────
# 本 namespace 三个 Deployment（go-api／py-api／ai-rpc）的 stdout 是**唯一日志载体**：
# Go 侧 slog JSON 行（internal/obs 注入 trace_id/user_id，缺值渲染 "-"），Python 侧
# core/logging ContextFilter 文本行（trace_id=<值>，形状同一字面量）。
# deploy/k8s/60-observability/ 的 Loki＋promtail 清单只认这两种形状做索引——
# 形状字面量由 backend/tests/test_trace_observability_manifests.py 三方钉死。
# 本 ConfigMap **不新增任何日志相关键**：「要不要收进 Loki」不是运行时开关，
# 采集面属部署配置；应用（上刀）另行授权，本目录当前只是文件。
apiVersion: v1
kind: ConfigMap
metadata:
  name: closenai-config
  namespace: closenai
data:
  APP_NAME: "ClosenAI"
  ENVIRONMENT: "production"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_EXPIRE_MINUTES: "30"
  JWT_REFRESH_EXPIRE_DAYS: "30"
  HTTP_ADDR: ":8000"
  SHUTDOWN_TIMEOUT_SECONDS: "15"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # ── N8 灰度面（Go-only，变量名带 CLOSEN_ 前缀，Python 侧没有对应字段）──
  # 集群内 py-api 的 Service 地址。百分比未到 100 的域，go-api 把请求逐字转交到这里；
  # 缺这个值而百分比 <100 时 go-api **拒绝启动**，所以它不能留空或靠默认值。
  CLOSEN_PY_API_URL: "http://py-api.closenai.svc.cluster.local:8000"
  # 每域一个数：0＝该域一条都不自己答（真的 0%，只多一跳代理），100＝全量由 Go 答。
  # 越界（<0 或 >100）是拒绝启动而不是夹紧——「运维以为切了其实没切」比没有开关更糟。
  CLOSEN_CUTOVER_ANALYTICS: "0"
  CLOSEN_CUTOVER_DISCOVERY: "0"
  # 批 2（curriculum 域）：这一域的响应里有 week_start / 每张卡的 date / revealed，
  # 全是「用户本地今天」的函数，所以它是第一个带**日历**的域。0% 时 go-api 逐字转交，
  # 放量前唯一的判据是 go-core/testdata/n8_contract.json 的 curriculum 组与 week_window 语料。
  CLOSEN_CUTOVER_CURRICULUM: "0"
  # 批 3（journey 域）：这一域的 GET /journey/events 是**惰性写入者**——先按剧本预写
  # （ensure_prefilled，六行一个事务）再读。0% 时 go-api 逐字转交、一行业务都不跑，
  # 所以写权仍在 Python 一侧；一旦放量，同一账号的预写就由 Go 提交，判据是夹具的
  # journey 组 46 条逐字节回放（含 uuid 主键的掩码次数，见 n8_replay_test.go）。
  CLOSEN_CUTOVER_JOURNEY: "0"
  # 批 4（onboarding 域）：这一域的 POST 是**一次请求写三处**——推荐码惰性生成、
  # onboarding_profiles upsert（无条件）、六行剧本预写，Python 用请求级事务在响应前一次提交，
  # Go 侧对应 SubmitOnboarding 的单个 pgx 事务。另两处只有本批有的判据：响应里的文案要过
  # 措辞闸（filter_template，零 LLM），share_url 的深链形状由 site_url＋推荐码字符集决定。
  # 0% 时 go-api 逐字转交，三处写与闸都仍归 Python；放量判据＝夹具 onboarding 组 28 条
  # 逐字节回放＋template_corpus 106 条（闭包 92＋对抗探针 14）。
  CLOSEN_CUTOVER_ONBOARDING: "0"
  # 批 5（mood 两条**纯读**：GET /mood/history、GET /mood/trend）：这一批是四个已切流域里
  # 第一家全不写库，但也是第一家**同域混切**的：POST /mood/checkin 要调 LLM、动配额、写库，
  # 本批不切，而 Ingress 的 Prefix 一刀会把它一起搬到 go-api（Go 侧没注册就是当场 404，
  # 与百分比无关——转交发生在 handler 内部，路径没匹配上根本进不到 handler）。
  # 于是这一批的 path 降到**端点级 Exact**（见 50-ingress.yaml），灰度键仍是域级：
  # MOOD 一条盖住 history 与 trend 两条 path。
  # ↳ REFLECTIONS 这一键本批**只声明不上 path**：Ingress 的 path 匹配**不看 HTTP 方法**，
  # 而 /api/v1/reflections 在契约里 GET 与 POST 共用同一个 path（openapi 实测两法），
  # Exact 也会把那条写操作的 POST 一起搬走 ⇒ Go 未注册 ⇒ 405。Go 侧三条读面与夹具都齐了
  # （reflection 组 11 条逐字节回放），整刀与 POST /reflections、/reflections/generate
  # 一起归最后一批。键先落在清单里、值为 0，是为了让「放量只改数字」这一条不需要再发版。
  # 判据＝夹具 mood 组 40 条＋reflection 组 11 条逐字节回放（两组掩码次数均为 0）
  # ＋mood_copy_corpus 60 格（15 locale × 4 键）＋language_resolve_corpus 23 格；
  # 「域级键 × 端点级 path」的错位由 backend/tests/test_k8s_manifests.py 里
  # 按 (方法, 路径) 模拟最长前缀路由的那条判据守住。
  CLOSEN_CUTOVER_MOOD: "0"
  CLOSEN_CUTOVER_REFLECTIONS: "0"
  # 批 6（memories 两条**纯读**：GET /memories、GET /memories/{memory_id}）：这一键同样
  # **只声明不上 path**，而且比 REFLECTIONS 更硬——两条 path 各挂着未实现的兄弟方法
  # （`/api/v1/memories` 同 path 有 POST 建记忆、`/api/v1/memories/{memory_id}` 同 path 有
  # DELETE 软删，openapi 实测），Ingress 的 path 匹配不看方法 ⇒ Exact 也把写侧一起搬进
  # 只注册了 GET 的 go-api ⇒ 405，与百分比无关（决策点 D-10 在批 6 命中两条而不是一条）。
  # Go 侧两条读面与夹具都齐了（memories 组 43 条逐字节回放、掩码次数 0），整刀与
  # POST/DELETE、以及语义搜索那条一起归最后一批。键先落在清单里、值为 0，
  # 是为了让「放量只改数字」不需要再发版——口径与 REFLECTIONS 逐字一致。
  # ⚠️ 本域另有一条**已登记的两侧发散**不随本键生效：`GET /api/v1/memories/`（尾斜杠）
  # Python 走 Starlette 的 redirect_slashes 给 307，Go 的 mux 没有那条 pattern 给 404 信封；
  # 它没种进夹具（种了就是把已知不同形钉成契约），属放量前置项，见 memory_detail.go 文件头。
  CLOSEN_CUTOVER_MEMORIES: "0"
  # ── T6-04 审批位（Go-only；它**不是**第九个切流域）──────────────────────
  # 上面那八个键今天全是 "0"，那是**当前状态**不是约束：把一个域拨到 50 的动作
  # 在现网是「kubectl edit 一行」，没有第二个人签字、也没有任何一处代码反对。
  # 从本票起，go-api 在 ENVIRONMENT=production 且**任一个**百分比 > 0 时，
  # 必须读到 CLOSEN_CUTOVER_APPROVED="1" 才肯启动，否则拒绝启动
  # （判据 internal/cutover/approval.go，逐格闸 cutover/approval_test.go，
  # §验收 第二句「把切流键改 50 且无审批 ⇒ 启动失败」的靶在 scripts/mutate_t604_gates.py）。
  # 取值面只认 ""|0|1：写成 "true"/"yes"/"1 " 一律拒启（同 CLOSEN_INSIGHT_EVIDENCE_READ 的口径——
  # 一个「以为签了字其实没签」的审批位比没有审批位更危险）。
  # 放在 ConfigMap 而不是 Secret：它是**流程标记**不是凭据，放量之后它必须能被审计读到。
  # 双签流程与回滚口径写在 deploy/README.md「staging 那一档」一节第 2 条。
  CLOSEN_CUTOVER_APPROVED: "0"
  # PostHog 收件箱地址。默认值两侧都是这个字面量（backend/config.py:160），
  # 写进清单是为了让「换区域」是一次配置改动而不是重新出镜像。
  # POSTHOG_API_KEY 属敏感项，只进 Secret closenai-runtime，不进本文件。
  POSTHOG_HOST: "https://eu.i.posthog.com"
  # ── T3-03：BFF → Go 内部面（/internal/v3/*）的代理目标 ──────────────────
  # 只有 py-api 读这一个键（backend/config.py 的 go_api_url）。地址给集群内 Service DNS：
  # 内部面**不走 Ingress**（50-ingress.yaml 没有任何规则覆盖 /internal/v3，公网进不来），
  # 所以这一跳必须在集群内直达，不能填公网域名——填了会让流量出集群再回来，
  # 而回来的那一跳在 Ingress 上 404。
  # 与 CLOSEN_PY_API_URL 互为反向：那条是 Go 灰度期把未切的域转交回 Python，
  # 这条是 Python 把 canonical 的洞察面转交给 Go。两条都在清单里，方向相反，
  # 所以任何一次「把整域切给 Go」都不需要临时发明第三条路径。
  # 留空时 py-api 的三条洞察端点**在拨号之前**回 503（v3_proxy.dial_target），不静默降级。
  # GO_SERVICE_TOKEN 是敏感项，只进 Secret closenai-runtime（与 Go 侧读的是同一个键名、
  # 同一个值），不进本文件。
  GO_API_URL: "http://go-api.closenai.svc.cluster.local:8000"
