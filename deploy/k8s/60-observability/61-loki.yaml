# 批 T-F（⑦）· Loki：把「一条 trace_id grep 全链」从「登三次机」变成一次查询。
#
# 交付边界（工作单原文）：**只交付文件＋评审可读**。上刀（apply 到集群）＝另行授权（T-9），
# 本目录没有任何东西被应用过；镜像 tag 是本机未拉取的钉选值，上刀前必须先真拉一次验证。
#
# 形状取舍（单节点 4c8G，VPS 上还跑着别的项目——这是唯一集群，见 [[reference-closenai-infra-targets]]）：
# · 单二进制 all-in-one＋filesystem 存储：无对象存储、无 memcached、无 hash ring 副本。
#   代价写明白：loki 挂掉＝聚合视图没了，grep 各 Pod stdout 的土办法仍然是完备退路
#   （日志本体在 stdout，Loki 只是索引副本——所以这一格坏了不碰任何业务路径）。
# · trace_id **做索引标签**是工作单拍板（D 口径），明知这是高基数标签：钉 168h 留存＋
#   只收 closenai 三个 Deployment 的 stdout 来压基数。哪天查不动，先动的是这里，
#   改法是把 trace_id 降级成 structured metadata（Loki 侧标签进 label index，值不进）。
# · 只做 ingress 不做 egress，不配多租户：auth_enabled=false 的前提是 3100 只在 ClusterIP 内，
#   清单里没有把它接到 Ingress——要暴露必须另带认证，那不是本批的形状。
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: closenai
  labels:
    app: loki
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        # tsdb＋v13 是 Loki 3.x 的当前推荐组合；from 用未来日期语义＝首部署的唯一起点。
        - from: 2026-10-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      # 168h＝7 天。trace_id 作为标签的检索窗口由这一格定，超过就查不到是**设计**不是故障。
      retention_period: 168h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      # 单节点内存兜底：超了先拒写（promtail 会重试），不是把整个 VPS 顶穿。
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 8
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: closenai
  labels:
    app: loki
spec:
  # 恒 1：filesystem 存储下多副本没有意义（没有共享对象存储就没有共享视图）。
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          # tag 上刀前真拉验证（本机未拉过，这是钉选的已知 3.x 发布线，不是实测存在性）。
          image: grafana/loki:3.3.2
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: closenai
  labels:
    app: loki
spec:
  accessModes:
    - ReadWriteOnce
  # k3s 默认 provisioner；这台 VPS 上没有别的 storageClass。换集群这一行必须重查，
  # 「本地盘 5Gi」是留存窗口的物理上限，不是容量承诺。
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: closenai
  labels:
    app: loki
spec:
  # ClusterIP（默认）：只有同集群的 promtail 打得进来，本清单不接 50-ingress。
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
