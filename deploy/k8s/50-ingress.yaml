# 入口路由。**N8 的切流一刀落在 path 上**：批 1–4 按**域**一刀（一个域一条 Prefix，
# backend 指向谁就由谁答这个域）；批 5 起遇到「同域里有不切的端点」，那一刀降到**端点级 Exact**
# （理由与判据见批 5 那一段）；未切流的端点整段留在 /api/v1 → py-api 这条兜底 Prefix 里。
#
# 灰度 0% 的可验证形态**不再**是「没有任何 path 指 go-api」，而是两条同时成立：
#   1. 指 go-api 的每条 path，ConfigMap 里都有对应的 CLOSEN_CUTOVER_<域>＝"0"；
#   2. CLOSEN_PY_API_URL 非空——百分比没到 100 时 go-api 把请求**逐字转交** py-api
#      （internal/cutover），所以 0% 是真的 0%：Go 侧一行业务逻辑都不跑，只多一跳代理。
# 于是「1%→10%→50%→100%」只改 ConfigMap 里的数字，不发版、不动 Ingress；
# 回滚＝把数改回 0（或整条 path 的 backend 改回 py-api），两条都不碰数据。
# go-api 侧对越界的百分比是**拒绝启动**而不是夹紧（internal/config），
# 缺 CLOSEN_PY_API_URL 而百分比 <100 同样是拒绝启动，所以上面第 2 条不会悄悄失效。
#
# 刻意不写 ingressClassName 与 controller 专有注解：目标集群是 k3s（默认 Traefik），
# 本机 OrbStack 无 IngressClass，写死注解会让任一侧失效。
# 依赖的是 Ingress 规范里两条 path 同现时的**最长前缀优先**（Traefik/nginx 均如此），
# 更具体的域 path 必须写在兜底 path 之前——顺序不决定优先级，长度才决定，
# 但把具体域写在前面便于人读，见 backend/tests/test_k8s_manifests.py 的结构断言。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: closenai
  namespace: closenai
  labels:
    app.kubernetes.io/part-of: closenai
spec:
  rules:
    # 无 host 规则：生产 API 域尚未注入（tasks.md K3），先按任意 host 收流。
    - http:
        paths:
          # ── N8 批 1：analytics + discovery（最低耦合的两个域）──
          - path: /api/v1/analytics
            pathType: Prefix
            backend:
              service:
                name: go-api
                port:
                  name: http
          - path: /api/v1/discovery
            pathType: Prefix
            backend:
              service:
                name: go-api
                port:
                  name: http
          # ── N8 批 2：curriculum（第一个带日历的域，判据见 10-config.yaml 的同名开关）──
          - path: /api/v1/curriculum
            pathType: Prefix
            backend:
              service:
                name: go-api
                port:
                  name: http
          # ── N8 批 3：journey（第一条**读接口会写库**的域，见 10-config.yaml 的同名开关）──
          - path: /api/v1/journey
            pathType: Prefix
            backend:
              service:
                name: go-api
                port:
                  name: http
          # ── N8 批 4：onboarding（第一条**一次请求写三处**的域，见 10-config.yaml 的同名开关）──
          - path: /api/v1/onboarding
            pathType: Prefix
            backend:
              service:
                name: go-api
                port:
                  name: http
          # ── N8 批 5：mood 两条纯读（GET /mood/history、GET /mood/trend）。
          # **这一批的 path 不是域级前缀**：同域的 POST /mood/checkin 要调 LLM、动配额、写库，
          # 本批不切；而 `Prefix /api/v1/mood` 会把它一起搬进 go-api，Go 侧没注册那条就是
          # 当场 404——**与灰度百分比无关**，0% 也救不回来（转交发生在 handler 内部，
          # 路径没匹配上根本进不到 handler）。所以这一批按端点列，pathType 用 Exact：
          # 只有这一条路径本身归 Go，域里将来新增的端点自动留在 py-api 一侧
          # （失败的方向是「没切」而不是「404」）。灰度键仍是域级（CLOSEN_CUTOVER_MOOD
          # 一条盖住下面两条），这个「域级键 × 端点级 path」的错位由
          # backend/tests/test_k8s_manifests.py 里「按 (方法, 路径) 模拟最长前缀路由后，
          # 落到 go-api 的每个契约操作都必须在 server.go 带方法注册」这条判据守住。
          # ↳ 2026-10-15 同一条判据顺带否掉了 GET /api/v1/reflections 的这一刀：
          # **Ingress 的 path 匹配不看 HTTP 方法**，而 `/api/v1/reflections` 在契约里
          # GET 与 POST 共用同一个 path（POST 是写＋配价的另一家），Exact 也会把 POST 搬走
          # ⇒ Go 未注册 ⇒ 405。该域整刀与 POST 一起归最后一批（auth/IAP/share/chat 那批），
          # CLOSEN_CUTOVER_REFLECTIONS 先在 ConfigMap 里声明为 0、本文件不上 path。
          - path: /api/v1/mood/history
            pathType: Exact
            backend:
              service:
                name: go-api
                port:
                  name: http
          - path: /api/v1/mood/trend
            pathType: Exact
            backend:
              service:
                name: go-api
                port:
                  name: http
          # ── 其余 88 个端点（含 app 级 /health）仍由 py-api 回答（后续批次逐域上移）──
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: py-api
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: py-api
                port:
                  name: http
