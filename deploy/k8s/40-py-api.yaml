# Python 侧现有 FastAPI 全量服务（py-api）。N8 按域切流期间它继续是绝大多数 path 的
# backend；回滚 = 把 Ingress 里该 path 的 backend 改回本 Service，不发版、不回滚数据。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: py-api
  namespace: closenai
  labels:
    app: py-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: py-api
  template:
    metadata:
      labels:
        app: py-api
    spec:
      containers:
        - name: py-api
          image: ghcr.io/jamesfeng2009/closenai-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: closenai-config
            - secretRef:
                name: closenai-runtime
          # T1-01 数据导出归档目录。**写在容器 env 而不是共享 ConfigMap**：
          # 10-config.yaml 的键是 Go/Python 两侧互认的名字（test_k8s_manifests 那条闸按
          # 名字对账），而导出归档只有 py-api 读写，塞进共享 ConfigMap 等于让 Go 声明一个
          # 它不读的键。路径与下面的 hostPath 成对，改一处必须改两处。
          env:
            - name: EXPORT_DIR
              value: /data/exports
          volumeMounts:
            # 单机 k3s：hostPath 而不是 PVC——这台集群没有可依赖的默认 StorageClass，
            # PVC Pending 会让整个 Deployment 起不来（比丢归档更糟）。代价说清楚：
            # 归档不跨节点，Pod 漂到别的节点就找不到旧包（下载回 50007，用户重新申请即可，
            # 而 /cron/export-jobs 会在下一轮把它退回队列）。
            - name: exports
              mountPath: /data/exports
          # /health 是契约内端点（contracts/endpoints.md 第 105 条，backend/main.py:170）。
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          # 规格照《架构与技术方案-2026-09-06》§十 k3s 部署清单（4c8G 单机）。
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1.5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: py-api
  namespace: closenai
  labels:
    app: py-api
spec:
  selector:
    app: py-api
  ports:
    - name: http
      port: 8000
      targetPort: http
