# Go Core：对外 HTTP + canonical 权威侧（D-1）。N1 阶段只接 healthz 与 auth 纵切，
# 不在 Ingress 上占任何 path（灰度 0%），切流由 50-ingress.yaml 逐域改 backend。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  namespace: closenai
  labels:
    app: go-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: go-api
          # 部署时由 CI 覆盖为带 digest 的 tag；私有 ghcr 需 imagePullSecrets。
          image: ghcr.io/jamesfeng2009/closenai-go-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # R4-④/R5-② 的两个 worker **嵌在本进程里**（仓库没有单独的 cmd 二进制，
          # 见 go-core/cmd/go-api/main.go 的 dispatch.New/inbound.New 两段接线），
          # 所以「生产有人消费」＝在这里把两个 kill switch 打开。地址走同一张
          # Secret closenai-runtime 的 CLOSEN_AMQP_URL，不在这里写第二份。
          # 开了却没给地址 ⇒ go-api 拒绝启动（log.Fatalf），与 compose prod 同口径。
          # 这两个键**不进** ConfigMap：10-config.yaml 的键面只收两侧 runtime 真正读的
          # 配置字段，而 worker 开关是 env-only（backend/ai/mq/config.py 文件头有同样的声明）。
          env:
            - name: CLOSEN_OUTBOX_WORKER
              value: "1"
            - name: CLOSEN_CANDIDATE_WORKER
              value: "1"
          envFrom:
            - configMapRef:
                name: closenai-config
            - secretRef:
                name: closenai-runtime
          # go-api 启动即 pgxpool.Ping，PG 不可达则进程退出（fail fast，不带病接流量）。
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: go-api
  namespace: closenai
  labels:
    app: go-api
spec:
  selector:
    app: go-api
  ports:
    - name: http
      port: 8000
      targetPort: http
